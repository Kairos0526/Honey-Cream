<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030706">
<title>Honey Cream · Cybernetic Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030706; --surface:rgba(10, 20, 16, 0.75); --surface2:rgba(15, 30, 24, 0.85); 
  --line:rgba(0, 255, 136, 0.25); --line-bright:rgba(0, 255, 136, 0.6);
  --neon:#00ff88; --neon-glow:rgba(0, 255, 136, 0.35);
  --amber:#ffb703; --amber-glow:rgba(255, 183, 3, 0.4);
  --cream:#e0fbfc; --muted:#8d99ae; --danger:#ff5470;
  --font-tech:"Orbitron", sans-serif;
  --font-mono:"Share Tech Mono", monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);perspective:1400px}
body{
  font-family:var(--font-mono);color:var(--cream);
  background:radial-gradient(circle at 50% -20%, #082d20 0%, var(--bg) 70%), var(--bg);
  min-height:100vh;padding:env(safe-area-inset-top) 0 calc(120px + env(safe-area-inset-bottom));
  line-height:1.5;overflow-x:hidden;position:relative;
}

/* Red cibernética de fondo y partículas */
.cyber-grid{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image: linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 0 30px; }
}
.particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;background:var(--neon);
  box-shadow:0 0 8px var(--neon);opacity:0;animation:cyberRain linear infinite;
}
@keyframes cyberRain{
  0%{transform:translateY(-10vh);opacity:0}
  20%{opacity:0.8}
  80%{opacity:0.5}
  100%{transform:translateY(110vh);opacity:0}
}

.app{max-width:480px;margin:0 auto;padding:0 16px;position:relative;z-index:2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

/* Cabecera Holográfica */
header{text-align:center;padding:32px 0 20px;perspective:1000px}
.holo-container{
  width:110px;height:110px;margin:0 auto 16px;position:relative;
  transform-style:preserve-3d;animation:holoFloat 5s ease-in-out infinite;
}
@keyframes holoFloat{
  0%,100%{transform:translateY(0) rotateX(6deg) rotateY(-6deg)}
  50%{transform:translateY(-10px) rotateX(-6deg) rotateY(6deg)}
}
.holo-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:2px dashed var(--neon);opacity:0.6;
  animation:spinRing 12s linear infinite;
}
@keyframes spinRing{to{transform:rotate(360deg)}}
.logo{
  width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:rgba(5, 15, 11, 0.9);
  border:2px solid var(--neon);
  box-shadow:0 0 25px var(--neon-glow), inset 0 0 15px var(--neon-glow);
  overflow:hidden;position:relative;
}
.logo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(0,255,136,0), rgba(0,255,136,0.3) 50%, rgba(0,255,136,0));
  animation:scanline 2.5s linear infinite;pointer-events:none;
}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}

h1{
  font-family:var(--font-tech);font-size:32px;font-weight:900;letter-spacing:2px;color:#fff;
  text-shadow:0 0 10px var(--neon-glow), 0 0 20px rgba(0,255,136,0.3);
}
.tagline{font-size:14px;color:var(--amber);margin-top:6px;letter-spacing:1px;text-transform:uppercase}

/* Panel Holográfico / Info */
.info{
  background:var(--surface);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:16px;padding:8px 16px;margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.7), inset 0 0 15px rgba(0,255,136,0.05);
  position:relative;overflow:hidden;
}
.info::before{
  content:"SYS_LOC // SEC-18";position:absolute;top:4px;right:10px;
  font-size:9px;color:var(--neon);opacity:0.5;letter-spacing:1px;
}
.row{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.row+.row{border-top:1px solid rgba(0,255,136,0.1)}
.row svg{flex:none;width:18px;height:18px;margin-top:3px;stroke:var(--neon);fill:none;stroke-width:2;filter:drop-shadow(0 0 5px var(--neon))}
.row b{display:block;font-weight:700;font-size:13px;color:var(--amber);letter-spacing:1px}
.row p{font-size:13px;color:var(--muted)}

/* Selector / Pestañas cibernéticas */
.tabs-wrap{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.seg{
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  background:var(--surface);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:4px;
}
.seg .thumb{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:8px;
  background:linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,255,136,0.4));
  border:1px solid var(--neon);
  box-shadow:0 0 12px var(--neon-glow);
  transition:transform .3s cubic-bezier(.3,.8,.3,1);
}
.seg[data-mode="mayor"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;padding:10px 0;font-family:var(--font-tech);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:1px;transition:color .2s}
.seg button[aria-selected="true"]{color:var(--neon);text-shadow:0 0 8px var(--neon-glow)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 16px;letter-spacing:0.5px}

/* Tarjetas de productos 3D Tilt Cyber */
.list{display:grid;gap:16px;perspective:1000px}
.card{
  position:relative;display:grid;grid-template-columns:92px 1fr;gap:14px;
  background:var(--surface);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:18px;padding:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  transform-style:preserve-3d;
  transition:transform 0.15s ease-out, border-color 0.2s, box-shadow 0.2s;
  overflow:hidden;
}
.card:hover{
  border-color:var(--line-bright);
  box-shadow:0 15px 35px rgba(0,0,0,0.8), 0 0 20px var(--neon-glow);
}
.card.out{opacity:.5}
.thumb-img{
  width:92px;height:92px;border-radius:12px;
  background:rgba(0,0,0,0.5);border:1px solid rgba(0,255,136,0.3);
  display:grid;place-items:center;overflow:hidden;
  font-family:var(--font-tech);font-size:30px;color:var(--neon);
  box-shadow:inset 0 0 10px rgba(0,255,136,0.2);
  transform:translateZ(15px);
}
.thumb-img img{width:100%;height:100%;object-fit:cover}
.body{display:flex;flex-direction:column;min-width:0;transform:translateZ(10px)}
.body h3{font-family:var(--font-tech);font-size:18px;line-height:1.2;font-weight:700;color:#fff}
.desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.price{font-family:var(--font-tech);font-weight:700;font-size:17px;color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}
.stock{font-size:11px;color:var(--muted)}
.stock.low{color:var(--danger)}

/* Botones tecnológicos */
.add{
  background:rgba(0,255,136,0.1);border:1px solid var(--neon);color:var(--neon);
  font-family:var(--font-tech);font-weight:700;font-size:12px;padding:8px 14px;border-radius:8px;
  box-shadow:0 0 10px rgba(0,255,136,0.15);transition:all 0.2s;
}
.add:hover{background:var(--neon);color:#030706;box-shadow:0 0 15px var(--neon)}
.add:disabled{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.1);color:var(--muted);cursor:not-allowed;box-shadow:none}

.step{
  display:flex;align-items:center;background:rgba(0,0,0,0.6);
  border:1px solid var(--neon);border-radius:8px;overflow:hidden;
}
.step button{width:34px;height:34px;font-size:18px;font-weight:700;color:var(--neon);transition:background 0.2s}
.step button:hover:not(:disabled){background:rgba(0,255,136,0.2)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:24px;text-align:center;font-family:var(--font-tech);font-size:13px;font-weight:700;color:var(--cream)}

/* Estados */
.skel{height:114px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 25%, rgba(0,255,136,0.05) 50%, var(--surface) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--muted);padding:30px 12px}
.msg button{margin-top:12px;color:var(--neon);border:1px solid var(--neon);border-radius:8px;padding:8px 18px;font-family:var(--font-tech);font-size:12px}

/* Carrito Cibernético Flotante */
.bar{
  position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translate(-50%,170%);width:calc(100% - 32px);max-width:448px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:16px;
  background:rgba(6, 22, 16, 0.9);backdrop-filter:blur(15px);
  border:1px solid var(--neon);box-shadow:0 15px 35px rgba(0,0,0,0.8), 0 0 20px var(--neon-glow);
  transition:transform .35s cubic-bezier(.3,.8,.3,1);
}
.bar.show{transform:translate(-50%,0)}
.bar b{font-family:var(--font-tech);font-size:13px;color:var(--muted);letter-spacing:1px}
.bar .tot{font-family:var(--font-tech);font-size:22px;font-weight:700;color:var(--amber);text-shadow:0 0 10px var(--amber-glow)}

/* Modal / Sheet Holográfico */
.sheet-bg{position:fixed;inset:0;background:rgba(2, 6, 5, 0.8);backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:88vh;overflow:auto;z-index:50;
  background:rgba(8, 24, 18, 0.95);backdrop-filter:blur(20px);
  border:1px solid var(--neon);border-top:2px solid var(--neon);
  border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -15px 45px rgba(0,0,0,0.9), 0 0 25px var(--neon-glow);
  transition:transform .35s cubic-bezier(.3,.8,.3,1);
}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{font-family:var(--font-tech);font-size:24px;color:#fff;margin-bottom:6px;letter-spacing:1px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid rgba(0,255,136,0.15)}
.line .n{font-size:13px;font-weight:700;color:var(--cream)}
.line .s{font-size:12px;color:var(--muted)}
.field{
  width:100%;margin-top:10px;background:rgba(0,0,0,0.6);color:var(--cream);
  border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:14px;
}
.field:focus{border-color:var(--neon);box-shadow:0 0 10px var(--neon-glow);outline:none}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0;font-size:14px}
.total strong{font-family:var(--font-tech);font-size:28px;color:var(--amber);text-shadow:0 0 10px var(--amber-glow)}

.wa{
  width:100%;padding:14px;border-radius:12px;
  background:linear-gradient(135deg, #00ff88, #00b4d8);color:#030706;
  font-family:var(--font-tech);font-weight:900;font-size:14px;letter-spacing:1px;
  display:flex;justify-content:center;align-items:center;gap:8px;
  box-shadow:0 0 20px var(--neon-glow);transition:all 0.2s;
}
.wa:hover{box-shadow:0 0 30px var(--neon);transform:translateY(-2px)}
.wa svg{width:20px;height:20px;fill:currentColor}
.close{float:right;color:var(--muted);font-size:24px;line-height:1;padding:4px 8px;cursor:pointer}
.close:hover{color:var(--neon)}

.toast{
  position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-180%);
  background:rgba(8, 24, 18, 0.95);border:1px solid var(--neon);
  padding:10px 20px;border-radius:999px;font-size:13px;z-index:60;transition:transform .35s;
  max-width:90%;box-shadow:0 0 20px var(--neon-glow);letter-spacing:0.5px;color:var(--neon);
}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="cyber-grid"></div>
<div class="particles" id="particles" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="holo-container">
      <div class="holo-ring"></div>
      <div class="logo" role="img" aria-label="Logotipo de Honey Cream">
        <img src="logo.jpg" alt="Honey Cream Logo">
      </div>
    </div>
    <h1>HONEY CREAM</h1>
    <p class="tagline">// Cybernetic Sweets & Honey</p>
  </header>

  <section class="info" aria-label="Información de la tienda">
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <div><b>UBICACIÓN_SYS</b><p>Ciudadela, Zona 18, Edif. 4, Apto 3-6</p></div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      <div><b>ZONAS_DE_ENVÍO</b><p>Casco de San Felipe, Corotico, Marín y Albarico</p></div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><b>HORARIO_OPERATIVO</b><p>Lunes a Sábado: 8:00 a.m. - 5:00 p.m.</p></div>
    </div>
  </section>

  <div class="tabs-wrap">
    <div class="seg" id="seg" data-mode="detal" role="tablist" aria-label="Tipo de compra">
      <span class="thumb"></span>
      <button role="tab" aria-selected="true" data-mode="detal">AL DETAL</button>
      <button role="tab" aria-selected="false" data-mode="mayor">AL MAYOR</button>
    </div>
  </div>
  <p class="hint" id="hint">MODO: Precios por unidad individual</p>

  <main class="list" id="list" aria-live="polite"></main>
</div>

<button class="bar" id="bar" aria-label="Ver pedido">
  <span><b id="barCount">0 ITEMS</b><br><small style="color:var(--neon)">ACCEDER AL CARRITO</small></span>
  <span class="tot" id="barTotal">$0.00</span>
</button>

<div class="sheet-bg" id="bg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Resumen del pedido">
  <button class="close" id="close" aria-label="Cerrar">×</button>
  <h2>// ORDEN_ACTUAL</h2>
  <div id="lines"></div>
  <input class="field" id="name" placeholder="Nombre de usuario" autocomplete="name">
  <select class="field" id="zone" aria-label="Entrega">
    <option value="Retiro en tienda">Retiro en tienda</option>
    <option>Casco de San Felipe</option>
    <option>Corotico</option>
    <option>Marín</option>
    <option>Albarico</option>
  </select>
  <div class="total"><span id="sheetMode" style="color:var(--muted)">TOTAL GENERAL</span><strong id="sheetTotal">$0.00</strong></div>
  <button class="wa" id="send">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.2 14.8l-.4-.2-2.600.8.8-2.500-.3-.4A8 8 0 0 1 12 4zm-3 4c-.3 0-.7.2-.9.6-.3.5-.5 1.100-.1 2 .6 1.500 2.300 3.500 4.500 4.500 1 .4 1.700.4 2.200.3.500-.1 1.100-.6 1.300-1.200.1-.3.100-.6 0-.7l-1.700-.8c-.2-.1-.4 0-.5.100l-.6.800c-.1.100-.3.100-.4.100-.6-.3-1.600-.9-2.300-2-.1-.2 0-.3.100-.4l.4-.5c.1-.1.100-.3 0-.5l-.7-1.600c-.1-.2-.3-.3-.5-.3z"/></svg>
    TRANSMITIR PEDIDO VIA WHATSAPP
  </button>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Configuración ===== */
const CSV_URL    = "https://docs.google.com/spreadsheets/d/11gpTcGFAPMcElmUwwHpCeKTWIDSCBjZZxbFTtOLIrzc/export?format=csv&gid=0";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo7__4Q6VsGWTTcaGJgPWw6w7Evt083ny3uxGUHnHqc2I869M2bPYHGQC8bqT5L2ojcQ/exec";
const WHATSAPP   = "584245284850";
const MONEDA     = "$";

/* ===== Partículas cibernéticas ===== */
(function initParticles(){
  const wrap = document.getElementById("particles");
  for(let i = 0; i < 22; i++){
    const p = document.createElement("span");
    p.className = "particle";
    p.style.left = (Math.random() * 100) + "%";
    p.style.animationDuration = (Math.random() * 5 + 4) + "s";
    p.style.animationDelay = (Math.random() * 5) + "s";
    wrap.appendChild(p);
  }
})();

/* ===== Tilt 3D Cibernético ===== */
function bind3DTilt(){
  document.querySelectorAll(".card").forEach(card => {
    const move = (clientX, clientY) => {
      const r = card.getBoundingClientRect();
      const x = clientX - r.left, y = clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -12;
      const ry = ((x / r.width) - 0.5) * 12;
      card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(8px)`;
    };
    const reset = () => { card.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(0px)"; };
    card.addEventListener("mousemove", e => move(e.clientX, e.clientY));
    card.addEventListener("mouseleave", reset);
    card.addEventListener("touchmove", e => { if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    card.addEventListener("touchend", reset);
  });
}

let products = [], mode = "detal", cart = {};
const $ = id => document.getElementById(id);
const money = n => MONEDA + (Number(n) || 0).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function num(v){
  if (v == null) return NaN;
  let s = String(v).replace(/[^\d.,-]/g, "");
  if (s.includes(",") && !s.includes(".")) s = s.replace(",", ".");
  else s = s.replace(/,/g, "");
  return parseFloat(s);
}
function toProducts(rows){
  return rows.map((r, i) => {
    const name = (r[0] || "").trim();
    const detal = num(r[1]), mayor = num(r[2]), stock = num(r[3]);
    return {
      id: "f" + (i + 1), fila: i + 1, name, desc: "", img: "",
      detal, mayor: isNaN(mayor) ? detal : mayor,
      stock: isNaN(stock) ? 0 : Math.max(0, Math.floor(stock))
    };
  }).filter(p => p.name && !isNaN(p.detal));
}
async function load(){
  $("list").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const res = await fetch(CSV_URL + "&t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    products = toProducts(parseCSV(await res.text()));
    if (!products.length) throw new Error("vacío");
    render();
  }catch(e){
    $("list").innerHTML = '<div class="msg">ERROR DE CONEXIÓN CON EL SERVIDOR DE DATOS.<br><button id="retry">REINTENTAR</button></div>';
    $("retry").onclick = load;
  }
}

const price = p => mode === "mayor" ? p.mayor : p.detal;
function render(){
  $("list").innerHTML = products.map(p => {
    const q = cart[p.id] || 0, out = p.stock <= 0;
    const ctl = out ? '<button class="add" disabled>AGOTADO</button>'
      : q === 0 ? `<button class="add" data-act="add" data-id="${esc(p.id)}">+ AÑADIR</button>`
      : `<div class="step"><button data-act="minus" data-id="${esc(p.id)}">−</button><output>${q}</output><button data-act="plus" data-id="${esc(p.id)}" ${q >= p.stock ? "disabled" : ""}>+</button></div>`;
    const stk = out ? "" : `<span class="stock ${p.stock <= 5 ? "low" : ""}">${p.stock <= 5 ? "¡ÚLTIMOS " + p.stock + "!" : "Stock: " + p.stock}</span>`;
    const img = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<article class="card ${out ? "out" : ""}">
      <div class="thumb-img">${img || esc(p.name.charAt(0).toUpperCase())}</div>
      <div class="body"><h3>${esc(p.name)}</h3>${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
        <div class="foot"><div><div class="price">${money(price(p))}</div>${stk}</div>${ctl}</div></div>
    </article>`;
  }).join("");
  bind3DTilt();
  updateCart();
}
function lines(){
  return products.filter(p => cart[p.id]).map(p => ({p, q: cart[p.id], sub: cart[p.id] * price(p)}));
}
function updateCart(){
  const ls = lines(), count = ls.reduce((a, l) => a + l.q, 0), total = ls.reduce((a, l) => a + l.sub, 0);
  $("bar").classList.toggle("show", count > 0);
  $("barCount").textContent = count + (count === 1 ? " ITEM" : " ITEMS");
  $("barTotal").textContent = $("sheetTotal").textContent = money(total);
  $("sheetMode").textContent = "TOTAL // " + (mode === "mayor" ? "AL MAYOR" : "AL DETAL");
  $("lines").innerHTML = ls.map(l => `<div class="line"><div><div class="n">${esc(l.p.name)}</div><div class="s">${l.q} × ${money(price(l.p))} = ${money(l.sub)}</div></div>
    <div class="step"><button data-act="minus" data-id="${esc(l.p.id)}">−</button><output>${l.q}</output><button data-act="plus" data-id="${esc(l.p.id)}" ${l.q >= l.p.stock ? "disabled" : ""}>+</button></div></div>`).join("");
  if (!count) closeSheet();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = products.find(x => x.id === b.dataset.id); if (!p) return;
  const q = cart[p.id] || 0;
  if (b.dataset.act === "minus") q <= 1 ? delete cart[p.id] : cart[p.id] = q - 1;
  else if (q < p.stock) cart[p.id] = q + 1;
  else toast("LÍMITE DE STOCK ALCANZADO");
  render();
});
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode; $("seg").dataset.mode = mode;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("hint").textContent = mode === "mayor" ? "MODO: Precios al por mayor (bulk)" : "MODO: Precios por unidad individual";
  render();
});
const openSheet = () => { $("sheet").classList.add("open"); $("bg").classList.add("open"); };
const closeSheet = () => { $("sheet").classList.remove("open"); $("bg").classList.remove("open"); };
$("bar").onclick = openSheet; $("close").onclick = closeSheet; $("bg").onclick = closeSheet;
let tt; function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600); }

$("send").onclick = () => {
  const ls = lines(); if (!ls.length) return;
  const total = ls.reduce((a, l) => a + l.sub, 0);
  const name = $("name").value.trim(), zone = $("zone").value;
  const tipo = mode === "mayor" ? "Al Mayor" : "Al Detal";
  const text = ["🍯 *PEDIDO CYBER - HONEY CREAM*", `Tipo: ${tipo}`, name ? `Cliente: ${name}` : "", `Destino: ${zone}`, "",
    ...ls.map(l => `• ${l.q} × ${l.p.name} — ${money(l.sub)}`), "", `*TOTAL: ${money(total)}*`].filter((x, i) => x !== "" || i > 0).join("\n");

  const payload = {
    accion: "descontar_inventario", fecha: new Date().toISOString(), tipo, cliente: name, entrega: zone, total,
    items: ls.map(l => ({fila: l.p.fila, id: l.p.id, producto: l.p.name, cantidad: l.q, precio: price(l.p)}))
  };
  fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), keepalive:true}).catch(() => {});

  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`, "_blank");
  ls.forEach(l => l.p.stock = Math.max(0, l.p.stock - l.q));
  cart = {}; closeSheet(); render(); toast("ORDEN TRANSMITIDA CON ÉXITO");
};

load();
</script>
</body>
</html>
