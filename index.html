<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Honey Cream · 3D Holographic Bees UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg: #050507;
  --glass: rgba(14, 15, 20, 0.58);
  --glass-card: rgba(20, 22, 30, 0.65);
  --silver: #e2e8f0;
  --silver-line: rgba(226, 232, 240, 0.28);
  --silver-glow: rgba(226, 232, 240, 0.35);
  --gold: #e3b04b;
  --gold-bright: #ffe5a3;
  --gold-deep: #9e7019;
  --gold-glow: rgba(227, 176, 75, 0.4);
  --pearl: #f8fafc;
  --muted: #9ca3af;
  --danger: #fb7185;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Outfit", system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);perspective:1600px}
body{
  font-family:var(--sans);color:var(--pearl);
  background:radial-gradient(circle at 50% 15%, #12131a 0%, #050507 70%);
  min-height:100vh;padding:env(safe-area-inset-top) 0 calc(135px + env(safe-area-inset-bottom));
  line-height:1.55;overflow-x:hidden;position:relative;
}

/* Lienzo 3D con abejas articuladas y gotas de miel */
#holo-canvas{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:1;
}

/* Ondas de luz holográficas translúcidas */
.light-waves{
  position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;
}
.wave{
  position:absolute;width:180%;height:180%;top:-40%;left:-40%;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(226,232,240,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(227,176,75,0.07) 0%, transparent 50%);
  filter:blur(30px);
  animation:driftWave 18s ease-in-out infinite alternate;
}
@keyframes driftWave{
  0%{transform:translate(-4%, -3%) rotate(0deg) scale(1)}
  50%{transform:translate(4%, 5%) rotate(12deg) scale(1.08)}
  100%{transform:translate(-2%, 2%) rotate(-8deg) scale(0.98)}
}

.app{
  max-width:480px;margin:0 auto;padding:0 16px;
  position:relative;z-index:2;
  transform-style:preserve-3d;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Cabecera Holográfica Flotando en el Aire */
header{
  text-align:center;padding:34px 0 22px;
  perspective:1200px;position:relative;
}
.holo-stage{
  width:140px;height:140px;margin:0 auto 14px;position:relative;
  transform-style:preserve-3d;
  animation:levitateUI 5.5s ease-in-out infinite;
}
@keyframes levitateUI{
  0%,100%{transform:translateY(0px) rotateX(6deg) rotateY(-5deg)}
  50%{transform:translateY(-14px) rotateX(-5deg) rotateY(6deg)}
}
.ring-silver{
  position:absolute;inset:-14px;border-radius:50%;
  border:1.5px solid var(--silver-line);
  border-top-color:var(--silver);
  border-bottom-color:var(--silver);
  box-shadow:0 0 22px var(--silver-glow), inset 0 0 14px var(--silver-glow);
  animation:spin3D 10s linear infinite;
}
.ring-gold{
  position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed var(--gold);
  box-shadow:0 0 20px var(--gold-glow);
  animation:spin3DRev 15s linear infinite;
}
@keyframes spin3D{to{transform:rotateZ(360deg) rotateX(18deg)}}
@keyframes spin3DRev{to{transform:rotateZ(-360deg) rotateY(18deg)}}

.logo{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(35,38,48,0.85), rgba(8,9,12,0.92));
  border:1.5px solid var(--silver);
  box-shadow:
    0 20px 45px rgba(0,0,0,0.9),
    0 0 30px var(--gold-glow),
    inset 0 0 20px var(--silver-glow);
  overflow:hidden;position:relative;
  backdrop-filter:blur(12px);
}
.logo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 0%, rgba(226,232,240,0.35) 50%, transparent 100%);
  animation:holoScan 2.8s linear infinite;
}
@keyframes holoScan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:0.94}

h1{
  font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:0.8px;color:var(--pearl);
  text-shadow:0 6px 24px rgba(0,0,0,0.95), 0 0 25px var(--silver-glow);
}
.tagline{
  font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold);margin-top:4px;
  text-shadow:0 0 15px var(--gold-glow);
}

/* Paneles UI Flotantes en Vidrio Esmerilado */
.floating-panel{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(135%);
  -webkit-backdrop-filter:blur(22px) saturate(135%);
  border:1px solid var(--silver-line);
  border-top:1px solid rgba(255,255,255,0.45);
  border-radius:24px;padding:14px 20px;margin-bottom:22px;
  box-shadow:
    0 25px 50px -12px rgba(0,0,0,0.9),
    0 0 25px rgba(226,232,240,0.08),
    inset 0 1px 1px rgba(255,255,255,0.2);
  transform-style:preserve-3d;
  transition:transform 0.2s ease-out, box-shadow 0.3s ease;
  position:relative;overflow:hidden;
}
.floating-panel::before{
  content:"HOLO_SWARM // 3D ARTICULATED";position:absolute;top:6px;right:16px;
  font-size:8px;letter-spacing:2px;color:var(--silver);opacity:0.55;
}
.row{display:flex;gap:14px;padding:12px 0;align-items:flex-start}
.row+.row{border-top:1px solid rgba(226,232,240,0.12)}
.row svg{
  flex:none;width:19px;height:19px;margin-top:3px;
  stroke:var(--gold);fill:none;stroke-width:1.8;
  filter:drop-shadow(0 0 8px var(--gold-glow));
}
.row b{display:block;font-weight:600;font-size:14px;color:var(--pearl)}
.row p{font-size:13.5px;color:var(--silver);opacity:0.8}

/* Pestañas Flotantes Plateadas y Doradas */
.tabs-wrap{position:sticky;top:10px;z-index:20;padding:6px 0}
.seg{
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  background:rgba(12, 13, 18, 0.78);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--silver-line);
  border-top:1px solid rgba(255,255,255,0.35);
  border-radius:16px;padding:5px;
  box-shadow:0 15px 35px rgba(0,0,0,0.85), 0 0 20px rgba(226,232,240,0.08);
}
.seg .thumb{
  position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:12px;
  background:linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-deep));
  border:1px solid #fff3c4;
  box-shadow:0 0 22px var(--gold-glow);
  transition:transform .35s cubic-bezier(.3,.8,.3,1);
}
.seg[data-mode="mayor"] .thumb{transform:translateX(100%)}
.seg button{
  position:relative;z-index:1;padding:11px 0;font-weight:600;font-size:13.5px;
  color:var(--silver);letter-spacing:0.5px;transition:color .25s;
}
.seg button[aria-selected="true"]{color:#050507;font-weight:700}
.hint{font-size:13px;color:var(--silver);opacity:0.75;text-align:center;margin:8px 0 18px}

/* Tarjetas Holográficas Flotantes */
.list{display:grid;gap:20px;perspective:1200px}
.card{
  position:relative;display:grid;grid-template-columns:100px 1fr;gap:16px;
  background:var(--glass-card);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--silver-line);
  border-top:1px solid rgba(255,255,255,0.42);
  border-radius:24px;padding:16px;
  box-shadow:
    0 22px 45px -10px rgba(0,0,0,0.9),
    0 0 20px rgba(226,232,240,0.06),
    inset 0 1px 0 rgba(255,255,255,0.22);
  transform-style:preserve-3d;
  transition:transform 0.16s ease-out, border-color 0.3s, box-shadow 0.3s;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(226,232,240,0.22), rgba(227,176,75,0.08) 40%, transparent 70%);
  opacity:0;transition:opacity 0.25s;
}
.card:hover::before,.card:active::before{opacity:1}
.card:hover{
  border-color:var(--gold);
  box-shadow:
    0 28px 55px -8px rgba(0,0,0,0.95),
    0 0 32px var(--gold-glow),
    inset 0 1px 0 rgba(255,255,255,0.35);
}
.card.out{opacity:.55}

.thumb-img{
  width:100px;height:100px;border-radius:18px;
  background:radial-gradient(circle at 30% 30%, rgba(45,48,60,0.8), rgba(10,11,15,0.95));
  border:1px solid rgba(226,232,240,0.35);
  display:grid;place-items:center;overflow:hidden;
  font-family:var(--serif);font-size:38px;font-style:italic;color:var(--gold);
  box-shadow:0 10px 25px rgba(0,0,0,0.6), inset 0 0 18px var(--silver-glow);
  transform:translateZ(26px);
}
.thumb-img img{width:100%;height:100%;object-fit:cover}

.body{display:flex;flex-direction:column;min-width:0;transform:translateZ(18px)}
.body h3{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:700;color:var(--pearl)}
.desc{font-size:13px;color:var(--silver);opacity:0.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px;gap:8px}
.price{font-weight:700;font-size:19px;color:var(--gold-bright);text-shadow:0 0 14px var(--gold-glow)}
.stock{font-size:12px;color:var(--silver);opacity:0.75}
.stock.low{color:var(--danger);font-weight:600;opacity:1}

/* Botones Holográficos */
.add{
  background:linear-gradient(135deg, var(--gold-bright), var(--gold));
  color:#050507;font-weight:700;font-size:13px;padding:10px 18px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:0 6px 20px var(--gold-glow);transition:all 0.2s;
}
.add:hover{box-shadow:0 8px 28px var(--gold);transform:translateY(-2px)}
.add:disabled{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1);color:var(--muted);box-shadow:none;cursor:not-allowed}

.step{
  display:flex;align-items:center;background:rgba(8,9,13,0.8);
  border:1px solid var(--silver-line);border-radius:12px;overflow:hidden;
  box-shadow:0 0 16px var(--silver-glow);
}
.step button{width:38px;height:38px;font-size:19px;font-weight:700;color:var(--gold);transition:background 0.2s}
.step button:hover:not(:disabled){background:rgba(226,232,240,0.15)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:28px;text-align:center;font-weight:700;font-size:14px;color:var(--pearl)}

/* Skeleton & Mensajes */
.skel{height:132px;border-radius:24px;background:linear-gradient(90deg, rgba(20,22,30,0.6) 25%, rgba(226,232,240,0.1) 50%, rgba(20,22,30,0.6) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--silver);padding:40px 12px;font-size:14px}
.msg button{margin-top:16px;color:var(--gold);border:1px solid var(--gold);border-radius:12px;padding:10px 22px;font-weight:600}

/* Carrito Flotante */
.bar{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,190%);width:calc(100% - 32px);max-width:448px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-radius:22px;
  background:rgba(14, 16, 24, 0.88);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border:1px solid var(--silver-line);
  border-top:1px solid rgba(255,255,255,0.45);
  box-shadow:0 25px 55px rgba(0,0,0,0.95), 0 0 30px var(--gold-glow);
  transition:transform .4s cubic-bezier(.3,.8,.3,1);
}
.bar.show{transform:translate(-50%,0)}
.bar b{font-weight:600;font-size:13px;color:var(--silver);letter-spacing:0.8px}
.bar .tot{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--gold-bright);text-shadow:0 0 15px var(--gold-glow)}

/* Modal / Sheet Holográfico */
.sheet-bg{position:fixed;inset:0;background:rgba(3, 4, 7, 0.82);backdrop-filter:blur(12px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:88vh;overflow:auto;z-index:50;
  background:rgba(15, 17, 25, 0.92);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--silver-line);border-top:1.5px solid var(--gold);
  border-radius:30px 30px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -25px 65px rgba(0,0,0,0.95), 0 0 40px var(--gold-glow);
  transition:transform .4s cubic-bezier(.3,.8,.3,1);
}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{font-family:var(--serif);font-size:32px;color:var(--pearl);margin-bottom:10px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-top:1px solid rgba(226,232,240,0.12)}
.line .n{font-size:14.5px;font-weight:600;color:var(--pearl)}
.line .s{font-size:13px;color:var(--silver);opacity:0.8}
.field{
  width:100%;margin-top:14px;background:rgba(5,6,9,0.75);color:var(--pearl);
  border:1px solid var(--silver-line);border-radius:14px;padding:15px;font:inherit;font-size:15px;
}
.field:focus{border-color:var(--gold);box-shadow:0 0 15px var(--gold-glow);outline:none}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0;font-size:15px}
.total strong{font-family:var(--serif);font-size:34px;color:var(--gold-bright)}

.wa{
  width:100%;padding:18px;border-radius:16px;
  background:linear-gradient(135deg, #25d366, #1ebe5d);color:#050507;
  font-weight:700;font-size:15px;
  display:flex;justify-content:center;align-items:center;gap:10px;
  box-shadow:0 0 30px rgba(37, 211, 102, 0.45);transition:all 0.25s;
}
.wa:hover{box-shadow:0 0 45px rgba(37, 211, 102, 0.75);transform:translateY(-2px)}
.wa svg{width:22px;height:22px;fill:currentColor}
.close{float:right;color:var(--silver);font-size:28px;line-height:1;padding:4px 8px;cursor:pointer}
.close:hover{color:var(--gold)}

.toast{
  position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-200%);
  background:rgba(15, 17, 25, 0.95);border:1px solid var(--silver);
  padding:13px 24px;border-radius:999px;font-size:14px;z-index:60;transition:transform .35s;
  max-width:90%;box-shadow:0 0 30px var(--silver-glow);color:var(--pearl);
  font-weight:600;backdrop-filter:blur(20px);
}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="holo-canvas"></canvas>
<div class="light-waves"><div class="wave"></div></div>

<div class="app">
  <header>
    <div class="holo-stage">
      <div class="ring-silver"></div>
      <div class="ring-gold"></div>
      <div class="logo" role="img" aria-label="Logotipo de Honey Cream">
        <img src="logo.jpg" alt="Honey Cream Logo">
      </div>
    </div>
    <h1>Honey Cream</h1>
    <p class="tagline">Como la miel pero más rico...</p>
  </header>

  <section class="floating-panel" id="infoPanel" aria-label="Información de la tienda">
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <div><b>Ubicación</b><p>Ciudadela, Zona 18, Edif. 4, Apto 3-6</p></div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      <div><b>Zonas de delivery</b><p>Casco de San Felipe, Corotico, Marín y Albarico</p></div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><b>Horario</b><p>Lunes a Sábado: 8:00 a.m. - 5:00 p.m.</p></div>
    </div>
  </section>

  <div class="tabs-wrap">
    <div class="seg" id="seg" data-mode="detal" role="tablist" aria-label="Tipo de compra">
      <span class="thumb"></span>
      <button role="tab" aria-selected="true" data-mode="detal">Al Detal</button>
      <button role="tab" aria-selected="false" data-mode="mayor">Al Mayor</button>
    </div>
  </div>
  <p class="hint" id="hint">Precios para compras por unidad</p>

  <main class="list" id="list" aria-live="polite"></main>
</div>

<button class="bar" id="bar" aria-label="Ver pedido">
  <span><b id="barCount">0 productos</b><br><small style="color:var(--gold)">Ver pedido</small></span>
  <span class="tot" id="barTotal">$0.00</span>
</button>

<div class="sheet-bg" id="bg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Resumen del pedido">
  <button class="close" id="close" aria-label="Cerrar">×</button>
  <h2>Tu pedido</h2>
  <div id="lines"></div>
  <input class="field" id="name" placeholder="Tu nombre" autocomplete="name">
  <select class="field" id="zone" aria-label="Entrega">
    <option value="Retiro en tienda">Retiro en tienda</option>
    <option>Casco de San Felipe</option>
    <option>Corotico</option>
    <option>Marín</option>
    <option>Albarico</option>
  </select>
  <div class="total"><span id="sheetMode" style="color:var(--silver)">Total</span><strong id="sheetTotal">$0.00</strong></div>
  <button class="wa" id="send">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.2 14.8l-.4-.2-2.600.8.8-2.500-.3-.4A8 8 0 0 1 12 4zm-3 4c-.3 0-.7.2-.9.6-.3.5-.5 1.100-.1 2 .6 1.500 2.300 3.500 4.500 4.500 1 .4 1.700.4 2.200.3.500-.1 1.100-.6 1.300-1.200.1-.3.100-.6 0-.7l-1.700-.8c-.2-.1-.4 0-.5.100l-.6.800c-.1.100-.3.100-.4.100-.6-.3-1.600-.9-2.300-2-.1-.2 0-.3.100-.4l.4-.5c.1-.1.100-.3 0-.5l-.7-1.600c-.1-.2-.3-.3-.5-.3z"/></svg>
    Enviar pedido por WhatsApp
  </button>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
const CSV_URL    = "https://docs.google.com/spreadsheets/d/11gpTcGFAPMcElmUwwHpCeKTWIDSCBjZZxbFTtOLIrzc/export?format=csv&gid=0";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo7__4Q6VsGWTTcaGJgPWw6w7Evt083ny3uxGUHnHqc2I869M2bPYHGQC8bqT5L2ojcQ/exec";
const WHATSAPP   = "584245284850";
const MONEDA     = "$";

/* ===== Motor 3D Three.js: Abejas Holográficas Articuladas con Alas Batientes + Gotas Hexagonales de Miel ===== */
(function initArticulatedBees3D(){
  const canvas = document.getElementById("holo-canvas");
  if(!window.THREE) return;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 26;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Materiales holográficos translúcidos
  const goldBodyMat = new THREE.MeshBasicMaterial({
    color: 0xe3b04b,
    transparent: true,
    opacity: 0.72
  });
  const silverStripeMat = new THREE.MeshBasicMaterial({
    color: 0xe2e8f0,
    transparent: true,
    opacity: 0.85
  });
  const wireOutlineMat = new THREE.MeshBasicMaterial({
    color: 0xffe5a3,
    wireframe: true,
    transparent: true,
    opacity: 0.35
  });
  const wingMat = new THREE.MeshBasicMaterial({
    color: 0xf8fafc,
    transparent: true,
    opacity: 0.42,
    side: THREE.DoubleSide
  });
  const wingEdgeMat = new THREE.MeshBasicMaterial({
    color: 0xe2e8f0,
    wireframe: true,
    transparent: true,
    opacity: 0.5
  });

  // Función constructora de una abeja 3D articulada con alas grandes definidas
  function createHolographicBee(scale = 1){
    const beeGroup = new THREE.Group();

    // 1. Cabeza
    const headGeo = new THREE.SphereGeometry(0.24, 12, 12);
    const head = new THREE.Mesh(headGeo, silverStripeMat);
    head.position.set(0, 0, 0.58);
    beeGroup.add(head);

    // Antenas delicadas
    const antGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.35, 6);
    const antL = new THREE.Mesh(antGeo, goldBodyMat);
    antL.position.set(-0.1, 0.22, 0.72);
    antL.rotation.set(0.5, 0, 0.3);
    const antR = new THREE.Mesh(antGeo, goldBodyMat);
    antR.position.set(0.1, 0.22, 0.72);
    antR.rotation.set(0.5, 0, -0.3);
    beeGroup.add(antL, antR);

    // 2. Tórax central
    const thoraxGeo = new THREE.SphereGeometry(0.34, 14, 14);
    thoraxGeo.scale(1, 0.95, 1.15);
    const thorax = new THREE.Mesh(thoraxGeo, goldBodyMat);
    thorax.position.set(0, 0, 0.2);
    const thoraxWire = new THREE.Mesh(thoraxGeo, wireOutlineMat);
    thoraxWire.position.copy(thorax.position);
    beeGroup.add(thorax, thoraxWire);

    // 3. Abdomen segmentado con franjas doradas y plateadas
    const abdGroup = new THREE.Group();
    abdGroup.position.set(0, -0.04, -0.42);

    const seg1 = new THREE.Mesh(new THREE.SphereGeometry(0.38, 14, 14), silverStripeMat);
    seg1.scale.set(1, 0.95, 0.8);
    seg1.position.z = 0.16;

    const seg2 = new THREE.Mesh(new THREE.SphereGeometry(0.41, 14, 14), goldBodyMat);
    seg2.scale.set(1, 0.95, 0.9);
    seg2.position.z = -0.05;

    const seg3 = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 14), silverStripeMat);
    seg3.scale.set(1, 0.92, 0.95);
    seg3.position.z = -0.26;

    const stinger = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.35, 8), goldBodyMat);
    stinger.rotation.x = -Math.PI / 2;
    stinger.position.z = -0.52;

    abdGroup.add(seg1, seg2, seg3, stinger);
    beeGroup.add(abdGroup);

    // 4. Alas translúcidas grandes y definidas con pivote en el tórax para aletear
    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.bezierCurveTo(0.4, 0.35, 1.35, 0.45, 1.55, 0.1);
    wingShape.bezierCurveTo(1.65, -0.15, 0.95, -0.35, 0, -0.05);

    const wingGeo = new THREE.ShapeGeometry(wingShape, 16);
    wingGeo.rotateX(Math.PI / 2);

    // Pivote Ala Izquierda
    const leftWingPivot = new THREE.Group();
    leftWingPivot.position.set(0.18, 0.28, 0.22);
    const leftWingMesh = new THREE.Mesh(wingGeo, wingMat);
    const leftWingWire = new THREE.Mesh(wingGeo, wingEdgeMat);
    leftWingPivot.add(leftWingMesh, leftWingWire);

    // Pivote Ala Derecha (espejada)
    const rightWingPivot = new THREE.Group();
    rightWingPivot.position.set(-0.18, 0.28, 0.22);
    rightWingPivot.scale.x = -1;
    const rightWingMesh = new THREE.Mesh(wingGeo, wingMat);
    const rightWingWire = new THREE.Mesh(wingGeo, wingEdgeMat);
    rightWingPivot.add(rightWingMesh, rightWingWire);

    // Alas secundarias traseras más pequeñas
    const hindWingPivotL = new THREE.Group();
    hindWingPivotL.position.set(0.16, 0.24, 0.04);
    hindWingPivotL.scale.set(0.65, 0.65, 0.65);
    hindWingPivotL.rotation.y = -0.25;
    hindWingPivotL.add(new THREE.Mesh(wingGeo, wingMat));

    const hindWingPivotR = new THREE.Group();
    hindWingPivotR.position.set(-0.16, 0.24, 0.04);
    hindWingPivotR.scale.set(-0.65, 0.65, 0.65);
    hindWingPivotR.rotation.y = 0.25;
    hindWingPivotR.add(new THREE.Mesh(wingGeo, wingMat));

    beeGroup.add(leftWingPivot, rightWingPivot, hindWingPivotL, hindWingPivotR);
    beeGroup.scale.setScalar(scale);

    return {
      mesh: beeGroup,
      leftWing: leftWingPivot,
      rightWing: rightWingPivot,
      hindL: hindWingPivotL,
      hindR: hindWingPivotR
    };
  }

  // Enjambre principal orbitando alrededor de la cabecera
  const swarmGroup = new THREE.Group();
  swarmGroup.position.set(0, 4.8, -2);
  scene.add(swarmGroup);

  const orbitingBees = [];
  const orbitCount = 7;
  for(let i = 0; i < orbitCount; i++){
    const scale = 0.85 + (i % 3) * 0.22;
    const beeObj = createHolographicBee(scale);
    const angle = (i / orbitCount) * Math.PI * 2;
    const radius = 4.6 + (i % 2) * 1.4;

    beeObj.orbitData = {
      angle: angle,
      radius: radius,
      speed: 0.011 + (i % 3) * 0.003,
      yBase: (i % 3 - 1) * 1.3,
      yAmp: 0.6 + Math.random() * 0.5,
      flapOffset: i * 1.1,
      flapSpeed: 0.48 + Math.random() * 0.12
    };
    swarmGroup.add(beeObj.mesh);
    orbitingBees.push(beeObj);
  }

  // Abejas libres flotando y descendiendo suavemente por toda la pantalla
  const freeBees = [];
  for(let i = 0; i < 8; i++){
    const beeObj = createHolographicBee(0.55 + Math.random() * 0.25);
    beeObj.mesh.position.set(
      (Math.random() - 0.5) * 24,
      (Math.random() - 0.5) * 38,
      (Math.random() - 0.5) * 10 - 3
    );
    beeObj.flightData = {
      fallSpeed: 0.025 + Math.random() * 0.02,
      swaySpeed: 0.02 + Math.random() * 0.015,
      swayAmp: 1.8 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      flapSpeed: 0.52 + Math.random() * 0.1
    };
    scene.add(beeObj.mesh);
    freeBees.push(beeObj);
  }

  // Gotas hexagonales de miel dorada y destellos plateados descendiendo
  const dropCount = 120;
  const dropGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.05, 6);
  dropGeo.rotateX(Math.PI / 2);
  const honeyDropMat = new THREE.MeshBasicMaterial({ color: 0xe3b04b, transparent: true, opacity: 0.55 });
  const silverDropMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.45 });

  const honeyDrops = [];
  for(let i = 0; i < dropCount; i++){
    const drop = new THREE.Mesh(dropGeo, i % 3 === 0 ? silverDropMat : honeyDropMat);
    drop.position.set(
      (Math.random() - 0.5) * 40,
      (Math.random() - 0.5) * 48,
      (Math.random() - 0.5) * 22 - 4
    );
    drop.rotation.z = Math.random() * Math.PI;
    drop.userData = {
      vy: 0.022 + Math.random() * 0.032,
      rotSpeed: (Math.random() - 0.5) * 0.03,
      phase: Math.random() * Math.PI * 2
    };
    scene.add(drop);
    honeyDrops.push(drop);
  }

  let mouseX = 0, mouseY = 0;
  window.addEventListener("mousemove", e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  }, {passive:true});
  window.addEventListener("touchmove", e => {
    if(e.touches[0]){
      mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
    }
  }, {passive:true});

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  let tick = 0;
  function animate(){
    requestAnimationFrame(animate);
    tick += 1;

    // 1. Animar abejas orbitando alrededor del logo con aleteo rápido y definido
    orbitingBees.forEach(b => {
      const d = b.orbitData;
      d.angle += d.speed;
      const x = Math.cos(d.angle) * d.radius;
      const z = Math.sin(d.angle) * d.radius;
      const y = d.yBase + Math.sin(tick * 0.03 + d.flapOffset) * d.yAmp;

      b.mesh.position.set(x, y, z);
      // Orientar la cabeza hacia la dirección tangente del vuelo
      b.mesh.rotation.y = -d.angle;
      b.mesh.rotation.z = Math.sin(tick * 0.03 + d.flapOffset) * 0.15;

      // Aleteo pronunciado de las 4 alas
      const flap = Math.sin(tick * d.flapSpeed + d.flapOffset) * 0.72;
      b.leftWing.rotation.z = flap;
      b.rightWing.rotation.z = -flap;
      b.hindL.rotation.z = flap * 0.85;
      b.hindR.rotation.z = -flap * 0.85;
    });

    swarmGroup.rotation.y += (mouseX * 0.35 - swarmGroup.rotation.y) * 0.05;
    swarmGroup.rotation.x += (mouseY * 0.25 - swarmGroup.rotation.x) * 0.05;

    // 2. Animar abejas libres descendiendo en zigzag suave por la pantalla
    freeBees.forEach(b => {
      const f = b.flightData;
      b.mesh.position.y -= f.fallSpeed;
      const prevX = b.mesh.position.x;
      b.mesh.position.x += Math.cos(tick * f.swaySpeed + f.phase) * 0.045;
      const dx = b.mesh.position.x - prevX;

      // Inclinar la abeja según hacia dónde vuela
      b.mesh.rotation.y = dx > 0 ? 0.45 : -0.45;
      b.mesh.rotation.x = 0.25;

      const flap = Math.sin(tick * f.flapSpeed + f.phase) * 0.75;
      b.leftWing.rotation.z = flap;
      b.rightWing.rotation.z = -flap;
      b.hindL.rotation.z = flap * 0.85;
      b.hindR.rotation.z = -flap * 0.85;

      if(b.mesh.position.y < -22){
        b.mesh.position.y = 22;
        b.mesh.position.x = (Math.random() - 0.5) * 24;
      }
    });

    // 3. Animar gotas hexagonales de miel dorada y plateada
    honeyDrops.forEach(drop => {
      const u = drop.userData;
      drop.position.y -= u.vy;
      drop.position.x += Math.sin(tick * 0.02 + u.phase) * 0.015;
      drop.rotation.z += u.rotSpeed;
      if(drop.position.y < -25){
        drop.position.y = 25;
        drop.position.x = (Math.random() - 0.5) * 40;
      }
    });

    renderer.render(scene, camera);
  }
  animate();
})();

/* ===== Tilt 3D Interactivo en Paneles y Tarjetas ===== */
function bind3DTilt(){
  const elements = document.querySelectorAll(".card, .floating-panel");
  elements.forEach(el => {
    const move = (clientX, clientY) => {
      const r = el.getBoundingClientRect();
      const x = clientX - r.left, y = clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -12;
      const ry = ((x / r.width) - 0.5) * 12;
      el.style.setProperty("--mx", x + "px");
      el.style.setProperty("--my", y + "px");
      el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(14px)`;
    };
    const reset = () => { el.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(0px)"; };
    el.addEventListener("mousemove", e => move(e.clientX, e.clientY));
    el.addEventListener("mouseleave", reset);
    el.addEventListener("touchmove", e => { if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    el.addEventListener("touchend", reset);
  });
}

let products = [], mode = "detal", cart = {};
const $ = id => document.getElementById(id);
const money = n => MONEDA + (Number(n) || 0).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function num(v){
  if (v == null) return NaN;
  let s = String(v).replace(/[^\d.,-]/g, "");
  if (s.includes(",") && !s.includes(".")) s = s.replace(",", ".");
  else s = s.replace(/,/g, "");
  return parseFloat(s);
}
function toProducts(rows){
  return rows.map((r, i) => {
    const name = (r[0] || "").trim();
    const detal = num(r[1]), mayor = num(r[2]), stock = num(r[3]);
    return {
      id: "f" + (i + 1), fila: i + 1, name, desc: "", img: "",
      detal, mayor: isNaN(mayor) ? detal : mayor,
      stock: isNaN(stock) ? 0 : Math.max(0, Math.floor(stock))
    };
  }).filter(p => p.name && !isNaN(p.detal));
}
async function load(){
  $("list").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const res = await fetch(CSV_URL + "&t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    products = toProducts(parseCSV(await res.text()));
    if (!products.length) throw new Error("vacío");
    render();
  }catch(e){
    $("list").innerHTML = '<div class="msg">No se pudo cargar el catálogo. Revisa tu conexión.<br><button id="retry">Reintentar</button></div>';
    $("retry").onclick = load;
  }
}

const price = p => mode === "mayor" ? p.mayor : p.detal;
function render(){
  $("list").innerHTML = products.map(p => {
    const q = cart[p.id] || 0, out = p.stock <= 0;
    const ctl = out ? '<button class="add" disabled>Agotado</button>'
      : q === 0 ? `<button class="add" data-act="add" data-id="${esc(p.id)}">Agregar</button>`
      : `<div class="step"><button data-act="minus" data-id="${esc(p.id)}">−</button><output>${q}</output><button data-act="plus" data-id="${esc(p.id)}" ${q >= p.stock ? "disabled" : ""}>+</button></div>`;
    const stk = out ? "" : `<span class="stock ${p.stock <= 5 ? "low" : ""}">${p.stock <= 5 ? "Quedan " + p.stock : p.stock + " disponibles"}</span>`;
    const img = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<article class="card ${out ? "out" : ""}">
      <div class="thumb-img">${img || esc(p.name.charAt(0).toUpperCase())}</div>
      <div class="body"><h3>${esc(p.name)}</h3>${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
        <div class="foot"><div><div class="price">${money(price(p))}</div>${stk}</div>${ctl}</div></div>
    </article>`;
  }).join("");
  bind3DTilt();
  updateCart();
}
function lines(){
  return products.filter(p => cart[p.id]).map(p => ({p, q: cart[p.id], sub: cart[p.id] * price(p)}));
}
function updateCart(){
  const ls = lines(), count = ls.reduce((a, l) => a + l.q, 0), total = ls.reduce((a, l) => a + l.sub, 0);
  $("bar").classList.toggle("show", count > 0);
  $("barCount").textContent = count + (count === 1 ? " producto" : " productos");
  $("barTotal").textContent = $("sheetTotal").textContent = money(total);
  $("sheetMode").textContent = "Total · " + (mode === "mayor" ? "Al Mayor" : "Al Detal");
  $("lines").innerHTML = ls.map(l => `<div class="line"><div><div class="n">${esc(l.p.name)}</div><div class="s">${l.q} × ${money(price(l.p))} = ${money(l.sub)}</div></div>
    <div class="step"><button data-act="minus" data-id="${esc(l.p.id)}">−</button><output>${l.q}</output><button data-act="plus" data-id="${esc(l.p.id)}" ${l.q >= l.p.stock ? "disabled" : ""}>+</button></div></div>`).join("");
  if (!count) closeSheet();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = products.find(x => x.id === b.dataset.id); if (!p) return;
  const q = cart[p.id] || 0;
  if (b.dataset.act === "minus") q <= 1 ? delete cart[p.id] : cart[p.id] = q - 1;
  else if (q < p.stock) cart[p.id] = q + 1;
  else toast("Ya llegaste al máximo disponible");
  render();
});
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode; $("seg").dataset.mode = mode;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("hint").textContent = mode === "mayor" ? "Precios para compras al por mayor" : "Precios para compras por unidad";
  render();
});
const openSheet = () => { $("sheet").classList.add("open"); $("bg").classList.add("open"); };
const closeSheet = () => { $("sheet").classList.remove("open"); $("bg").classList.remove("open"); };
$("bar").onclick = openSheet; $("close").onclick = closeSheet; $("bg").onclick = closeSheet;
let tt; function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600); }

$("send").onclick = () => {
  const ls = lines(); if (!ls.length) return;
  const total = ls.reduce((a, l) => a + l.sub, 0);
  const name = $("name").value.trim(), zone = $("zone").value;
  const tipo = mode === "mayor" ? "Al Mayor" : "Al Detal";
  const text = ["🍯 *Pedido Honey Cream*", `Tipo: ${tipo}`, name ? `Nombre: ${name}` : "", `Entrega: ${zone}`, "",
    ...ls.map(l => `• ${l.q} × ${l.p.name} — ${money(l.sub)}`), "", `*Total: ${money(total)}*`].filter((x, i) => x !== "" || i > 0).join("\n");

  const payload = {
    accion: "descontar_inventario", fecha: new Date().toISOString(), tipo, cliente: name, entrega: zone, total,
    items: ls.map(l => ({fila: l.p.fila, id: l.p.id, producto: l.p.name, cantidad: l.q, precio: price(l.p)}))
  };
  fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), keepalive:true}).catch(() => {});

  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`, "_blank");
  ls.forEach(l => l.p.stock = Math.max(0, l.p.stock - l.q));
  cart = {}; closeSheet(); render(); toast("Pedido enviado. Gracias por elegir Honey Cream");
};

bind3DTilt();
load();
</script>
