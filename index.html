<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Cream - Tienda Oficial</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fffdf7; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid #f3c65f; margin-bottom: 30px; }
        h1 { color: #d98a16; margin: 0; }
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .producto-card { background: #fff; border: 1px solid #fae3a8; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .producto-card h3 { margin: 10px 0; color: #5c3a00; }
        .precio { font-size: 1.2em; font-weight: bold; color: #d98a16; margin: 5px 0; }
        .stock { font-size: 0.9em; color: #666; margin-bottom: 15px; }
        .agotado { color: #d9534f; font-weight: bold; }
        
        /* Controles de cantidad (+ / -) */
        .contador-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-control { background-color: #f3a825; color: white; border: none; width: 35px; height: 35px; border-radius: 5px; cursor: pointer; font-size: 1.2em; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .btn-control:disabled { background-color: #ccc; cursor: not-allowed; }
        .cantidad-display { font-size: 1.1em; font-weight: bold; min-width: 25px; text-align: center; }

        .carrito { margin-top: 40px; background: #fff; padding: 20px; border-radius: 10px; border: 2px solid #f3c65f; }
        .item-carrito { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; flex-wrap: wrap; gap: 10px; }
        .item-controles { display: flex; align-items: center; gap: 8px; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; margin-top: 20px; font-size: 1.1em; padding: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-whatsapp:hover { background-color: #1ebe57; }
        .btn-whatsapp:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍯 Honey Cream</h1>
        <p>Productos artesanales de miel</p>
    </header>

    <div id="catalogo" class="productos-grid">
        <p>Cargando productos desde el inventario...</p>
    </div>

    <div class="carrito">
        <h2>🛒 Tu Pedido</h2>
        <div id="lista-carrito">
            <p>El carrito está vacío.</p>
        </div>
        <h3 id="total-carrito">Total: $0.00</h3>
        <button id="btn-finalizar" class="btn-whatsapp" onclick="procesarPedido()" disabled>Hacer Pedido por WhatsApp</button>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo7__4Q6VsGWTTcaGJgPWw6w7Evt083ny3uxGUHnHqc2I869M2bPYHGQC8bqT5L2ojcQ/exec";
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/11gpTcGFAPMcElmUwwHpCeKTWIDSCBjZZxbFTtOLIrzc/edit?usp=drivesdk";
    const WHATSAPP_NUMERO = "584245284850";

    let inventario = [];
    let carrito = [];

    function obtenerEnlaceCSV(url) {
        const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (match && match[1]) {
            return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&gid=0`;
        }
        return url;
    }

    async function cargarProductos() {
        try {
            const csvUrl = obtenerEnlaceCSV(SHEET_URL);
            const respuesta = await fetch(csvUrl);
            const textoCSV = await respuesta.text();
            const filas = textoCSV.split("\n").slice(1);
            
            inventario = filas.map(fila => {
                const columnas = fila.split(",");
                if (columnas.length >= 4) {
                    return {
                        producto: columnas[0].trim(),
                        descripcion: columnas[1].trim(),
                        precio: parseFloat(columnas[2].trim()) || 0,
                        disponible: parseInt(columnas[3].trim()) || 0
                    };
                }
                return null;
            }).filter(item => item !== null && item.producto !== "");

            renderizarCatalogo();
            actualizarCarrito(); // Para mantener sincronizadas las cantidades visuales
        } catch (error) {
            document.getElementById("catalogo").innerHTML = "<p>Error al cargar el inventario.</p>";
            console.error(error);
        }
    }

    function renderizarCatalogo() {
        const contenedor = document.getElementById("catalogo");
        contenedor.innerHTML = "";

        inventario.forEach((item, index) => {
            const card = document.createElement("div");
            card.className = "producto-card";
            
            const sinStock = item.disponible <= 0;
            const enCarrito = carrito.find(c => c.producto === item.producto);
            const cantidadEnCarrito = enCarrito ? enCarrito.cantidad : 0;

            card.innerHTML = `
                <h3>${item.producto}</h3>
                <p>${item.descripcion}</p>
                <div class="precio">$${item.precio.toFixed(2)}</div>
                <div class="stock ${sinStock ? 'agotado' : ''}">
                    ${sinStock ? 'Agotado' : 'Disponibles: ' + item.disponible}
                </div>
                <div class="contador-container">
                    <button class="btn-control" onclick="cambiarCantidadCatalogo(${index}, -1)">-</button>
                    <span class="cantidad-display">${cantidadEnCarrito}</span>
                    <button class="btn-control" onclick="cambiarCantidadCatalogo(${index}, 1)" ${cantidadEnCarrito >= item.disponible || sinStock ? 'disabled' : ''}>+</button>
                </div>
            `;
            contenedor.appendChild(card);
        });
    }

    function cambiarCantidadCatalogo(index, cambio) {
        const prod = inventario[index];
        let enCarrito = carrito.find(c => c.producto === prod.producto);

        if (!enCarrito && cambio > 0) {
            carrito.push({
                producto: prod.producto,
                precio: prod.precio,
                cantidad: 1
            });
        } else if (enCarrito) {
            enCarrito.cantidad += cambio;
            if (enCarrito.cantidad <= 0) {
                carrito = carrito.filter(c => c.producto !== prod.producto);
            } else if (enCarrito.cantidad > prod.disponible) {
                enCarrito.cantidad = prod.disponible;
                alert("Has alcanzado el límite de stock disponible.");
            }
        }
        renderizarCatalogo();
        actualizarCarrito();
    }

    function actualizarCarrito() {
        const lista = document.getElementById("lista-carrito");
        const totalEl = document.getElementById("total-carrito");
        const btnFinalizar = document.getElementById("btn-finalizar");

        if (carrito.length === 0) {
            lista.innerHTML = "<p>El carrito está vacío.</p>";
            totalEl.innerText = "Total: $0.00";
            btnFinalizar.disabled = true;
            renderizarCatalogo();
            return;
        }

        lista.innerHTML = "";
        let total = 0;

        carrito.forEach((item) => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;
            const itemInventario = inventario.find(inv => inv.producto === item.producto);
            const stockMax = itemInventario ? itemInventario.disponible : item.cantidad;

            lista.innerHTML += `
                <div class="item-carrito">
                    <span><strong>${item.producto}</strong> ($${subtotal.toFixed(2)})</span>
                    <div class="item-controles">
                        <button class="btn-control" style="width:30px; height:30px; font-size:1em;" onclick="modificarDesdeCarrito('${item.producto}', -1)">-</button>
                        <span class="cantidad-display">${item.cantidad}</span>
                        <button class="btn-control" style="width:30px; height:30px; font-size:1em;" onclick="modificarDesdeCarrito('${item.producto}', 1)" ${item.cantidad >= stockMax ? 'disabled' : ''}>+</button>
                    </div>
                </div>
            `;
        });

        totalEl.innerText = `Total: $${total.toFixed(2)}`;
        btnFinalizar.disabled = false;
        renderizarCatalogo();
    }

    function modificarDesdeCarrito(nombreProducto, cambio) {
        let enCarrito = carrito.find(c => c.producto === nombreProducto);
        const prod = inventario.find(inv => inv.producto === nombreProducto);

        if (enCarrito) {
            enCarrito.cantidad += cambio;
            if (enCarrito.cantidad <= 0) {
                carrito = carrito.filter(c => c.producto !== nombreProducto);
            } else if (prod && enCarrito.cantidad > prod.disponible) {
                enCarrito.cantidad = prod.disponible;
                alert("Has alcanzado el límite de stock disponible.");
            }
        }
        actualizarCarrito();
    }

    function procesarPedido() {
        const btn = document.getElementById("btn-finalizar");
        btn.disabled = true;
        btn.innerText = "Procesando pedido...";

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: carrito })
        })
        .then(() => {
            let mensaje = "¡Hola! Quiero hacer el siguiente pedido en *Honey Cream*:%0A%0A";
            let totalGeneral = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;
                mensaje += `• ${item.cantidad}x ${item.producto} - $${subtotal.toFixed(2)}%0A`;
            });

            mensaje += `%0A*Total a pagar: $${totalGeneral.toFixed(2)}*`;

            window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${mensaje}`, "_blank");
            carrito = [];
            actualizarCarrito();
            btn.innerText = "Hacer Pedido por WhatsApp";
            setTimeout(cargarProductos, 2000);
        })
        .catch(err => {
            console.error(err);
            alert("Hubo un error de conexión. Intenta nuevamente.");
            btn.disabled.get = false;
            btn.innerText = "Hacer Pedido por WhatsApp";
        });
    }

    cargarProductos();
</script>

</body>
</html>
