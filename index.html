<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0b08">
<title>Honey Cream · Como la miel pero más rico...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0906; --surface:#1a130e; --surface2:#261c14; --line:#423120;
  --gold:#f0b94b; --gold-bright:#ffd97d; --gold-deep:#b0781e; --cream:#f6ecda; --muted:#b09e82; --danger:#e07a5f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);perspective:1200px}
body{
  font-family:var(--sans);color:var(--cream);
  background:radial-gradient(120% 60% at 50% -10%,#332110 0%,var(--bg) 65%) no-repeat,var(--bg);
  min-height:100vh;padding:env(safe-area-inset-top) 0 calc(115px + env(safe-area-inset-bottom));
  line-height:1.45;overflow-x:hidden;position:relative;
}
.app{max-width:480px;margin:0 auto;padding:0 16px;position:relative;z-index:2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Partículas 3D de miel flotando */
.particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,var(--gold-bright),transparent 70%);
  opacity:0;animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(105vh) scale(0.4);opacity:0}
  20%{opacity:0.45}
  80%{opacity:0.35}
  100%{transform:translateY(-10vh) scale(1.1);opacity:0}
}

/* Cabecera 3D */
header{text-align:center;padding:30px 0 20px;perspective:900px}
.logo-wrap{
  width:106px;height:106px;margin:0 auto 16px;position:relative;
  transform-style:preserve-3d;animation:floatLogo 4.5s ease-in-out infinite;
}
@keyframes floatLogo{
  0%,100%{transform:translateY(0px) rotateX(4deg) rotateY(-4deg)}
  50%{transform:translateY(-8px) rotateX(-4deg) rotateY(4deg)}
}
.logo{
  width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#3a2a15,#17110b 70%);
  border:2.5px solid var(--gold);
  box-shadow:
    0 15px 35px rgba(0,0,0,0.75),
    0 0 25px rgba(240,185,75,0.35),
    inset 0 0 12px rgba(255,217,125,0.4);
  overflow:hidden;position:relative;
}
.logo::after{
  content:"";position:absolute;inset:-50%;
  background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,0.35) 50%,transparent 65%);
  animation:shineLogo 5s infinite;
}
@keyframes shineLogo{
  0%{transform:translateX(-100%) rotate(25deg)}
  30%,100%{transform:translateX(100%) rotate(25deg)}
}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
h1{
  font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:.6px;line-height:1.05;
  text-shadow:0 4px 14px rgba(0,0,0,0.8),0 0 20px rgba(240,185,75,0.2);
}
.tagline{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold);margin-top:4px}

/* Tarjeta informativa 3D */
.info{
  background:linear-gradient(145deg,#211811,#150f0b);
  border:1px solid var(--line);border-top:1px solid rgba(240,185,75,0.3);
  border-radius:20px;padding:6px 16px;margin-bottom:20px;
  box-shadow:0 14px 30px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.06);
  transform-style:preserve-3d;transition:transform 0.2s ease-out;
}
.row{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.row+.row{border-top:1px solid var(--line)}
.row svg{flex:none;width:20px;height:20px;margin-top:2px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(240,185,75,0.3))}
.row b{display:block;font-weight:600;font-size:14px;color:var(--cream)}
.row p{font-size:14px;color:var(--muted)}

/* Pestañas 3D */
.tabs-wrap{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.seg{
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;
  box-shadow:inset 0 3px 8px rgba(0,0,0,0.7),0 4px 12px rgba(0,0,0,0.4);
}
.seg .thumb{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold),var(--gold-deep));
  box-shadow:0 4px 12px rgba(240,185,75,0.4),inset 0 1px 1px rgba(255,255,255,0.6);
  transition:transform .3s cubic-bezier(.3,.8,.3,1);
}
.seg[data-mode="mayor"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;padding:11px 0;font-weight:700;font-size:15px;color:var(--muted);transition:color .2s}
.seg button[aria-selected="true"]{color:#1a1208}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:2px 0 14px}

/* Catálogo con Tarjetas 3D Interactivas */
.list{display:grid;gap:14px;perspective:1000px}
.card{
  position:relative;display:grid;grid-template-columns:94px 1fr;gap:14px;
  background:linear-gradient(145deg,#221912,#140e0a);
  border:1px solid var(--line);border-top:1px solid rgba(240,185,75,0.25);
  border-radius:20px;padding:12px;
  box-shadow:0 12px 26px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
  transform-style:preserve-3d;
  transition:transform 0.18s ease-out, box-shadow 0.25s ease, border-color 0.25s ease;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,217,125,0.14), transparent 60%);
  opacity:0;transition:opacity 0.25s;
}
.card:hover::before,.card:active::before{opacity:1}
.card:hover{
  border-color:rgba(240,185,75,0.55);
  box-shadow:0 18px 36px rgba(0,0,0,0.65),0 0 18px rgba(240,185,75,0.15);
}
.card.out{opacity:.55}
.thumb-img{
  width:94px;height:94px;border-radius:14px;
  background:linear-gradient(135deg,#3d2b16,#19110a);
  border:1px solid rgba(240,185,75,0.2);
  display:grid;place-items:center;overflow:hidden;
  font-family:var(--serif);font-size:36px;font-style:italic;color:var(--gold);
  box-shadow:0 6px 14px rgba(0,0,0,0.45);
  transform:translateZ(18px);
}
.thumb-img img{width:100%;height:100%;object-fit:cover}
.body{display:flex;flex-direction:column;min-width:0;transform:translateZ(12px)}
.body h3{font-family:var(--serif);font-size:22px;line-height:1.15;font-weight:700}
.desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.price{font-weight:700;font-size:19px;color:var(--gold);text-shadow:0 2px 8px rgba(240,185,75,0.25)}
.stock{font-size:12px;color:var(--muted)}
.stock.low{color:var(--danger)}

/* Botones 3D con relieve */
.add{
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  color:#1a1208;font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px;
  box-shadow:0 4px 0 var(--gold-deep),0 8px 16px rgba(0,0,0,0.4);
  transition:transform 0.1s ease, box-shadow 0.1s ease;
}
.add:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 1px 0 var(--gold-deep),0 3px 8px rgba(0,0,0,0.4);
}
.add:disabled{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:not-allowed}

.step{
  display:flex;align-items:center;background:var(--surface2);
  border:1px solid var(--gold-deep);border-radius:999px;
  box-shadow:0 4px 10px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);
}
.step button{width:38px;height:36px;font-size:20px;font-weight:700;color:var(--gold);border-radius:999px;transition:transform 0.1s}
.step button:active:not(:disabled){transform:scale(0.88)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:24px;text-align:center;font-weight:700}

/* Estados */
.skel{height:118px;border-radius:20px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--muted);padding:28px 12px}
.msg button{margin-top:12px;color:var(--gold);border:1px solid var(--gold-deep);border-radius:999px;padding:9px 20px;font-weight:600}

/* Carrito flotante 3D */
.bar{
  position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translate(-50%,170%);width:calc(100% - 32px);max-width:448px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:20px;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1208;
  box-shadow:0 6px 0 var(--gold-deep),0 18px 38px rgba(0,0,0,.65);
  transition:transform .35s cubic-bezier(.3,.8,.3,1), box-shadow .1s;
}
.bar.show{transform:translate(-50%,0)}
.bar.show:active{transform:translate(-50%,3px);box-shadow:0 2px 0 var(--gold-deep),0 10px 20px rgba(0,0,0,.65)}
.bar b{font-weight:700}.bar .tot{font-family:var(--serif);font-size:25px;font-weight:700}

/* Modal / Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:88vh;overflow:auto;z-index:50;
  background:linear-gradient(180deg,#211811,#140e0a);border:1px solid var(--line);border-top:1px solid rgba(240,185,75,0.35);
  border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(0,0,0,0.75);transition:transform .35s cubic-bezier(.3,.8,.3,1);
}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{font-family:var(--serif);font-size:28px;margin-bottom:6px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line .n{font-size:14px;font-weight:600}.line .s{font-size:13px;color:var(--muted)}
.field{width:100%;margin-top:10px;background:var(--bg);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0;font-size:15px}
.total strong{font-family:var(--serif);font-size:30px;color:var(--gold)}
.wa{
  width:100%;padding:15px;border-radius:14px;background:linear-gradient(180deg,#2ee673,#25d366);color:#06210d;
  font-weight:700;font-size:16px;display:flex;justify-content:center;align-items:center;gap:8px;
  box-shadow:0 5px 0 #179c49,0 10px 20px rgba(0,0,0,0.4);transition:transform 0.1s,box-shadow 0.1s;
}
.wa:active{transform:translateY(3px);box-shadow:0 2px 0 #179c49,0 5px 10px rgba(0,0,0,0.4)}
.wa svg{width:20px;height:20px;fill:currentColor}
.close{float:right;color:var(--muted);font-size:26px;line-height:1;padding:4px 8px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);background:var(--surface2);border:1px solid var(--gold);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;transition:transform .35s;max-width:90%;box-shadow:0 10px 25px rgba(0,0,0,0.6)}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="particles" id="particles" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="logo-wrap">
      <div class="logo" role="img" aria-label="Logotipo de Honey Cream">
        <img src="logo.jpg" alt="Honey Cream Logo">
      </div>
    </div>
    <h1>Honey Cream</h1>
    <p class="tagline">Como la miel pero más rico...</p>
  </header>

  <section class="info" aria-label="Información de la tienda">
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <div><b>Ubicación</b><p>Ciudadela, Zona 18, Edif. 4, Apto 3-6</p></div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      <div><b>Zonas de delivery</b><p>Casco de San Felipe, Corotico, Marín y Albarico</p></div>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><b>Horario</b><p>Lunes a Sábado: 8:00 a.m. - 5:00 p.m.</p></div>
    </div>
  </section>

  <div class="tabs-wrap">
    <div class="seg" id="seg" data-mode="detal" role="tablist" aria-label="Tipo de compra">
      <span class="thumb"></span>
      <button role="tab" aria-selected="true" data-mode="detal">Al Detal</button>
      <button role="tab" aria-selected="false" data-mode="mayor">Al Mayor</button>
    </div>
  </div>
  <p class="hint" id="hint">Precios para compras por unidad</p>

  <main class="list" id="list" aria-live="polite"></main>
</div>

<button class="bar" id="bar" aria-label="Ver pedido">
  <span><b id="barCount">0 productos</b><br><small>Ver pedido</small></span>
  <span class="tot" id="barTotal">$0.00</span>
</button>

<div class="sheet-bg" id="bg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Resumen del pedido">
  <button class="close" id="close" aria-label="Cerrar">×</button>
  <h2>Tu pedido</h2>
  <div id="lines"></div>
  <input class="field" id="name" placeholder="Tu nombre" autocomplete="name">
  <select class="field" id="zone" aria-label="Entrega">
    <option value="Retiro en tienda">Retiro en tienda</option>
    <option>Casco de San Felipe</option>
    <option>Corotico</option>
    <option>Marín</option>
    <option>Albarico</option>
  </select>
  <div class="total"><span id="sheetMode">Total</span><strong id="sheetTotal">$0.00</strong></div>
  <button class="wa" id="send">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.2 14.8l-.4-.2-2.600.8.8-2.500-.3-.4A8 8 0 0 1 12 4zm-3 4c-.3 0-.7.2-.9.6-.3.5-.5 1.100-.1 2 .6 1.500 2.300 3.500 4.500 4.500 1 .4 1.700.4 2.200.3.500-.1 1.100-.6 1.300-1.200.1-.3.100-.6 0-.7l-1.700-.8c-.2-.1-.4 0-.5.100l-.6.800c-.1.100-.3.100-.4.100-.6-.3-1.600-.9-2.300-2-.1-.2 0-.3.100-.4l.4-.5c.1-.1.100-.3 0-.5l-.7-1.600c-.1-.2-.3-.3-.5-.3z"/></svg>
    Enviar pedido por WhatsApp
  </button>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Configuración ===== */
const CSV_URL    = "https://docs.google.com/spreadsheets/d/11gpTcGFAPMcElmUwwHpCeKTWIDSCBjZZxbFTtOLIrzc/export?format=csv&gid=0";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo7__4Q6VsGWTTcaGJgPWw6w7Evt083ny3uxGUHnHqc2I869M2bPYHGQC8bqT5L2ojcQ/exec";
const WHATSAPP   = "584245284850";
const MONEDA     = "$";

/* ===== Partículas ambientales ===== */
(function initParticles(){
  const wrap = document.getElementById("particles");
  for(let i = 0; i < 18; i++){
    const p = document.createElement("span");
    p.className = "particle";
    const size = Math.random() * 6 + 3;
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = (Math.random() * 100) + "%";
    p.style.animationDuration = (Math.random() * 8 + 7) + "s";
    p.style.animationDelay = (Math.random() * 6) + "s";
    wrap.appendChild(p);
  }
})();

/* ===== Efecto 3D Tilt Interactivo en Tarjetas ===== */
function bind3DTilt(){
  document.querySelectorAll(".card").forEach(card => {
    const move = (clientX, clientY) => {
      const r = card.getBoundingClientRect();
      const x = clientX - r.left;
      const y = clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -10;
      const ry = ((x / r.width) - 0.5) * 10;
      card.style.setProperty("--mx", x + "px");
      card.style.setProperty("--my", y + "px");
      card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px)`;
    };
    const reset = () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(0px)";
    };
    card.addEventListener("mousemove", e => move(e.clientX, e.clientY));
    card.addEventListener("mouseleave", reset);
    card.addEventListener("touchmove", e => {
      if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    card.addEventListener("touchend", reset);
  });
}

/* ===== Estado ===== */
let products = [], mode = "detal", cart = {};
const $ = id => document.getElementById(id);
const money = n => MONEDA + (Number(n) || 0).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== CSV ===== */
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function num(v){
  if (v == null) return NaN;
  let s = String(v).replace(/[^\d.,-]/g, "");
  if (s.includes(",") && !s.includes(".")) s = s.replace(",", ".");
  else s = s.replace(/,/g, "");
  return parseFloat(s);
}
function toProducts(rows){
  return rows.map((r, i) => {
    const name = (r[0] || "").trim();
    const detal = num(r[1]);
    const mayor = num(r[2]);
    const stock = num(r[3]);
    return {
      id: "f" + (i + 1), fila: i + 1, name, desc: "", img: "",
      detal, mayor: isNaN(mayor) ? detal : mayor,
      stock: isNaN(stock) ? 0 : Math.max(0, Math.floor(stock))
    };
  }).filter(p => p.name && !isNaN(p.detal));
}
async function load(){
  $("list").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const res = await fetch(CSV_URL + "&t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    products = toProducts(parseCSV(await res.text()));
    if (!products.length) throw new Error("vacío");
    render();
  }catch(e){
    $("list").innerHTML = '<div class="msg">No se pudo cargar el catálogo. Revisa tu conexión y vuelve a intentarlo.<br><button id="retry">Reintentar</button></div>';
    $("retry").onclick = load;
  }
}

/* ===== Render ===== */
const price = p => mode === "mayor" ? p.mayor : p.detal;
function render(){
  $("list").innerHTML = products.map(p => {
    const q = cart[p.id] || 0, out = p.stock <= 0;
    const ctl = out ? '<button class="add" disabled>Agotado</button>'
      : q === 0 ? `<button class="add" data-act="add" data-id="${esc(p.id)}">Agregar</button>`
      : `<div class="step"><button data-act="minus" data-id="${esc(p.id)}" aria-label="Quitar uno">−</button><output>${q}</output><button data-act="plus" data-id="${esc(p.id)}" aria-label="Agregar uno" ${q >= p.stock ? "disabled" : ""}>+</button></div>`;
    const stk = out ? "" : `<span class="stock ${p.stock <= 5 ? "low" : ""}">${p.stock <= 5 ? "Quedan " + p.stock : p.stock + " disponibles"}</span>`;
    const img = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<article class="card ${out ? "out" : ""}">
      <div class="thumb-img">${img || esc(p.name.charAt(0).toUpperCase())}</div>
      <div class="body"><h3>${esc(p.name)}</h3>${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
        <div class="foot"><div><div class="price">${money(price(p))}</div>${stk}</div>${ctl}</div></div>
    </article>`;
  }).join("");
  bind3DTilt();
  updateCart();
}
function lines(){
  return products.filter(p => cart[p.id]).map(p => ({p, q: cart[p.id], sub: cart[p.id] * price(p)}));
}
function updateCart(){
  const ls = lines(), count = ls.reduce((a, l) => a + l.q, 0), total = ls.reduce((a, l) => a + l.sub, 0);
  $("bar").classList.toggle("show", count > 0);
  $("barCount").textContent = count + (count === 1 ? " producto" : " productos");
  $("barTotal").textContent = $("sheetTotal").textContent = money(total);
  $("sheetMode").textContent = "Total · " + (mode === "mayor" ? "Al Mayor" : "Al Detal");
  $("lines").innerHTML = ls.map(l => `<div class="line"><div><div class="n">${esc(l.p.name)}</div><div class="s">${l.q} × ${money(price(l.p))} = ${money(l.sub)}</div></div>
    <div class="step"><button data-act="minus" data-id="${esc(l.p.id)}" aria-label="Quitar uno">−</button><output>${l.q}</output><button data-act="plus" data-id="${esc(l.p.id)}" aria-label="Agregar uno" ${l.q >= l.p.stock ? "disabled" : ""}>+</button></div></div>`).join("");
  if (!count) closeSheet();
}

/* ===== Eventos ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = products.find(x => x.id === b.dataset.id); if (!p) return;
  const q = cart[p.id] || 0;
  if (b.dataset.act === "minus") q <= 1 ? delete cart[p.id] : cart[p.id] = q - 1;
  else if (q < p.stock) cart[p.id] = q + 1;
  else toast("Ya llegaste al máximo disponible");
  render();
});
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode; $("seg").dataset.mode = mode;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("hint").textContent = mode === "mayor" ? "Precios para compras al por mayor" : "Precios para compras por unidad";
  render();
});
const openSheet = () => { $("sheet").classList.add("open"); $("bg").classList.add("open"); };
const closeSheet = () => { $("sheet").classList.remove("open"); $("bg").classList.remove("open"); };
$("bar").onclick = openSheet; $("close").onclick = closeSheet; $("bg").onclick = closeSheet;
let tt; function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600); }

/* ===== Checkout ===== */
$("send").onclick = () => {
  const ls = lines(); if (!ls.length) return;
  const total = ls.reduce((a, l) => a + l.sub, 0);
  const name = $("name").value.trim(), zone = $("zone").value;
  const tipo = mode === "mayor" ? "Al Mayor" : "Al Detal";
  const text = ["🍯 *Pedido Honey Cream*", `Tipo: ${tipo}`, name ? `Nombre: ${name}` : "", `Entrega: ${zone}`, "",
    ...ls.map(l => `• ${l.q} × ${l.p.name} — ${money(l.sub)}`), "", `*Total: ${money(total)}*`].filter((x, i) => x !== "" || i > 0).join("\n");

  const payload = {
    accion: "descontar_inventario", fecha: new Date().toISOString(), tipo, cliente: name, entrega: zone, total,
    items: ls.map(l => ({fila: l.p.fila, id: l.p.id, producto: l.p.name, cantidad: l.q, precio: price(l.p)}))
  };
  fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), keepalive:true}).catch(() => {});

  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`, "_blank");
  ls.forEach(l => l.p.stock = Math.max(0, l.p.stock - l.q));
  cart = {}; closeSheet(); render(); toast("Pedido enviado. Gracias por elegir Honey Cream");
};

load();
</script>
</body>
</html>
